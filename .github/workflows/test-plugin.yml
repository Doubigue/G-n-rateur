name: Test réel plugin intégré LinkShare v1.7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/plugin_embed.py'
      - '.github/scripts/linkshare_api.py'
      - '.github/scripts/validate_lsplugin.py'
      - '.github/examples/linkshare-uppercase/**'
      - '.github/linkshare-reference/LinkShare-Explorer-v1.7.zip'
      - '.github/workflows/test-plugin.yml'

permissions:
  contents: read

jobs:
  test-real-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Installer Android SDK 35 et D8
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Détecter LinkShare et compiler le vrai JAR plugin-api
        id: api
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linkshare-api"
          API=$(python3 .github/scripts/linkshare_api.py \
            --reference-zip .github/linkshare-reference/LinkShare-Explorer-v1.7.zip \
            --work "$RUNNER_TEMP/linkshare-api" --gradle gradle | tee "$RUNNER_TEMP/api-build.log" | tail -n1)
          test -s "$API"
          echo "jar=$API" >> "$GITHUB_OUTPUT"

      - name: Compiler l'exemple Kotlin contre l'API réelle (compileOnly)
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          gradle -p .github/examples/linkshare-uppercase :plugin:assemblePlugin --no-daemon \
            "-PlinkshareApiJar=${{ steps.api.outputs.jar }}" "-PandroidJar=$ANDROID_JAR"
          test -s .github/examples/linkshare-uppercase/plugin/build/libs/plugin.jar

      - name: Générer classes.dex et le paquet contrat 2
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/config.json" <<'JSON'
          {"name":"Exemple majuscules","pkg":"com.linkshare.example","versionName":"1.0.0","plugin":{"mode":"embedded"}}
          JSON
          KSTD=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" -name '*.jar' -type f | sort -V | tail -n1)
          python3 .github/scripts/plugin_embed.py "$RUNNER_TEMP/config.json" \
            .github/examples/linkshare-uppercase "$RUNNER_TEMP/Uppercase.lsplugin" \
            --api-jar "${{ steps.api.outputs.jar }}" --classpath "$KSTD"
          python3 .github/scripts/validate_lsplugin.py "$RUNNER_TEMP/Uppercase.lsplugin"

      - name: Vérifier qu'une API absente est refusée
        run: |
          set -e
          if python3 .github/scripts/plugin_embed.py "$RUNNER_TEMP/config.json" \
              .github/examples/linkshare-uppercase "$RUNNER_TEMP/invalid.lsplugin" --api-jar "$RUNNER_TEMP/no-api.jar"; then
            echo "::error::Un build sans API réelle aurait dû échouer."; exit 1
          fi
          echo "Refus d'une API absente : OK"

      - uses: actions/upload-artifact@v4
        with:
          name: exemple-linkshare-contrat-2
          path: ${{ runner.temp }}/Uppercase.lsplugin
          if-no-files-found: error
