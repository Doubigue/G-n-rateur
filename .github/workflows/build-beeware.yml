name: Build BeeWare APK

on:
  push:
    paths:
      - 'builds/*/beeware.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détecter la demande
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/beeware\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Briefcase
        run: pip install --upgrade pip briefcase

      - name: Installer ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick python3-pil

      - name: Clé de signature stable (mises à jour sans désinstaller)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/signing.sh" setup

      - name: Préparer le projet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          trap 'sleep 2' EXIT
          CFG="$GITHUB_WORKSPACE/$DIR/beeware.json"
          S="$GITHUB_WORKSPACE/.github/scripts"
          python3 "$S/android_setup.py" fetch "$CFG" "$GITHUB_WORKSPACE/$DIR" beeware
          mkdir -p "$GITHUB_WORKSPACE/work/src"
          unzip -q "$GITHUB_WORKSPACE/$DIR/app.zip" -d "$GITHUB_WORKSPACE/work/src"
          PP=$(python3 "$S/native_setup.py" find "$GITHUB_WORKSPACE/work/src" pyproject.toml || true)
          test -n "$PP" && grep -q '^\[tool\.briefcase' "$PP" || { echo "Aucun pyproject.toml avec [tool.briefcase] : crée le projet avec « briefcase new »."; exit 1; }
          ROOT=$(dirname "$PP")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          briefcase create android --no-input
          GR=$(find build -type d -path '*/android/gradle' | head -n1)
          test -n "$GR" || { echo "Projet Gradle Briefcase introuvable après « briefcase create »."; exit 1; }
          python3 "$S/native_setup.py" gradle "$CFG" "$GR" | tee "$GITHUB_WORKSPACE/work/gradle.out"
          MOD=$(sed -n 's/^MODULE=//p' "$GITHUB_WORKSPACE/work/gradle.out" | head -n1)
          if [ "$(jq -r .icon "$CFG")" = "true" ]; then
            python3 "$S/icon_setup.py" gradle "$MOD/src/main/res" "$GITHUB_WORKSPACE/$DIR/icon.png" "$(jq -r .color "$CFG")"
          fi
          python3 "$S/fonction_setup.py" "$MOD" "$CFG" "$GITHUB_WORKSPACE/$DIR/app.zip" "$GITHUB_WORKSPACE/$DIR/icon.png"

      - name: Compiler l'APK
        run: |
          set -o pipefail
          CFG="$GITHUB_WORKSPACE/$DIR/beeware.json"
          cd "$ROOT"
          briefcase build android --no-input 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          APK=$(find "$ROOT/build" -path '*outputs/apk/debug/*.apk' | head -n1)

          test -n "$APK" || { echo "Aucun APK produit."; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          bash "$GITHUB_WORKSPACE/.github/scripts/signing.sh" verify "$APK" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CF="$DIR/beeware.json"
          NAME=$(jq -r .name "$CF"); VN=$(jq -r .versionName "$CF")
          SLUG=$(echo "$NAME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//;s/-$//')
          [ -n "$SLUG" ] || SLUG=app
          test -f "$APK" || { echo "APK introuvable : $APK"; exit 1; }
          cp "$APK" "$SLUG-$VN.apk"
          CFGJ=$(jq -c 'del(.fromRelease,.replaces,.iconFrom)' "$CF")
          NOTES=$(printf 'Version : %s (%s)\nPaquet : %s\nType : beeware\nSignature : %s\nConfig : %s' "$VN" "$(jq -r .versionCode "$CF")" "$(jq -r .pkg "$CF")" "$SIGN_SHA256" "$CFGJ")
          FILES=("$SLUG-$VN.apk")
          if [ -f "$DIR/app.zip" ] && [ "$(jq -r '.sourceKind // ""' "$CF")" != "site" ]; then cp "$DIR/app.zip" source.zip; FILES+=(source.zip); fi
          if [ -f "$DIR/icon.png" ]; then FILES+=("$DIR/icon.png"); fi
          bash "$GITHUB_WORKSPACE/.github/scripts/release_create.sh" "apk-$ID" "${FILES[@]}" --title "$NAME" --notes "$NOTES"
          OLD=$(jq -r '.replaces // ""' "$CF")
          if [ -n "$OLD" ]; then gh release delete "$OLD" --cleanup-tag -y || true; fi

      - name: Nettoyer la demande
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -qm "Nettoyage $ID [skip ci]"
          git pull --rebase -q || true
          git push -q || true

      - name: Enregistrer le journal d'erreur
        if: failure()
        run: |
          [ -n "$DIR" ] || exit 0
          LOG="$GITHUB_WORKSPACE/build.log"
          OUT="$GITHUB_WORKSPACE/$DIR/build-error.txt"
          mkdir -p "$GITHUB_WORKSPACE/$DIR"
          {
            echo "== Journal de compilation ($ID) =="
            if [ -f "$LOG" ]; then
              sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$LOG" | tr -d '\r' | grep -v -E '^ *\[[= >]*\] +[0-9]+%' | tail -n 400 | cut -c1-4000
            else
              echo "Aucun journal disponible (échec avant la compilation)."
            fi
          } > "$OUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f "$DIR/build-error.txt"
          git commit -qm "Journal d'erreur $ID [skip ci]" || exit 0
          git pull --rebase -q || true
          git push -q || true
