name: Build Kotlin Multiplatform APK

on:
  push:
    paths:
      - 'builds/*/kmp.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détecter la demande
        shell: bash
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/kmp\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Installer le SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extraire le projet
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q "$DIR/app.zip" -d work
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler le module Android KMP
        run: |
          set -euo pipefail
          ROOT=$(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n1)
          test -n "$ROOT"
          cd "$ROOT"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find . -path '*/outputs/apk/debug/*.apk' ! -name '*androidTest*' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -name '*.apk' -print -quit)"


      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CFG="$DIR/kmp.json"
          NAME=$(jq -r .name "$CFG")
          VN=$(jq -r .versionName "$CFG")
          SLUG=$(echo "$NAME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//;s/-$//')
          [ -n "$SLUG" ] || SLUG=application
          APK=$(find . -type f -name '*.apk' -not -path '*/.gradle/*' | head -n1)
          test -n "$APK" || { echo "APK introuvable après compilation."; exit 1; }
          cp "$APK" "$SLUG-$VN.apk"
          bash "$GITHUB_WORKSPACE/.github/scripts/release_create.sh" "kmp-$ID" "$SLUG-$VN.apk" --title "$NAME — Build Kotlin Multiplatform APK" --notes "Compilation Android Build Kotlin Multiplatform APK. Version : $VN."

      - name: Nettoyer la demande
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -qm "Nettoyage build kmp $ID [skip ci]"
          git pull --rebase -q || true
          git push -q || true

      - name: Enregistrer le journal d'erreur
        if: failure()
        run: |
          mkdir -p "$DIR"
          { echo "== Journal Build Kotlin Multiplatform APK ($ID) =="; tail -n 400 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true; } > "$DIR/build-error.txt"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f "$DIR/build-error.txt"
          git commit -qm "Journal erreur kmp $ID [skip ci]" || true
          git push -q || true
