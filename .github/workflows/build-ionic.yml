name: Build Ionic APK

on:
  push:
    paths:
      - 'builds/*/ionic.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identifier la demande
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/ionic\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Installer SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Préparer et compiler Ionic / Capacitor
        run: |
          set -euo pipefail
          CFG="$GITHUB_WORKSPACE/$DIR/ionic.json"
          mkdir -p work/src
          unzip -q "$GITHUB_WORKSPACE/$DIR/app.zip" -d work/src
          ROOT=$(find work/src -name package.json -not -path '*/node_modules/*' -print -quit | xargs -r dirname)
          test -n "$ROOT" || { echo "package.json introuvable"; exit 1; }
          cd "$ROOT"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build) process.exit(1)" || { echo "Ajoute un script build dans package.json"; exit 1; }
          npm run build
          WEB=$(find . -maxdepth 3 -type f \( -path '*/index.html' \) -not -path '*/node_modules/*' | head -n1)
          test -n "$WEB" || { echo "Build web sans index.html"; exit 1; }
          WEBROOT=$(dirname "$WEB")
          NAME=$(jq -r '.name // "IonicApp"' "$CFG")
          PKG=$(jq -r '.pkg // "com.example.ionicapp"' "$CFG")
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init "$NAME" "$PKG" --web-dir "$WEBROOT"
          fi
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ionic-$ID.apk"
      - name: Publier l'APK dans GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CFG="$GITHUB_WORKSPACE/$DIR/ionic.json"
          NAME=$(jq -r '.name // "Application Ionic"' "$CFG")
          gh release create "apk-$ID" "$GITHUB_WORKSPACE/ionic-$ID.apk" --title "$NAME" --notes "APK Ionic / Capacitor compilé automatiquement."
      - name: Nettoyer la demande
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git rm -r --ignore-unmatch "$DIR"
          git commit -m "Nettoyage build Ionic $ID [skip ci]" || true
          git push || true
