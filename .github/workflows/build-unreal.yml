name: Build Unreal Android APK

on:
  push:
    paths:
      - 'builds/*/unreal.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64, unreal-android]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détecter la demande
        shell: bash
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/unreal\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Installer le SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extraire le projet
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q "$DIR/app.zip" -d work
      - name: Préparer Unreal Engine (runner auto-hébergé)
        run: |
          set -euo pipefail
          PROJECT=$(find work -name '*.uproject' -print -quit)
          test -n "$PROJECT"
          echo "UPROJECT=$PROJECT" >> "$GITHUB_ENV"
          test -n "${{ secrets.UNREAL_ENGINE_ROOT }}" || { echo "Définis le secret UNREAL_ENGINE_ROOT vers le dossier Unreal Engine installé sur le runner."; exit 1; }
          echo "UE_ROOT=${{ secrets.UNREAL_ENGINE_ROOT }}" >> "$GITHUB_ENV"
      - name: Compiler et empaqueter Android
        run: |
          set -euo pipefail
          UAT="$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          test -x "$UAT"
          "$UAT" BuildCookRun -project="$GITHUB_WORKSPACE/$UPROJECT" -noP4 -platform=Android -clientconfig=Development -build -cook -stage -pak -archive -archivedirectory="$GITHUB_WORKSPACE/Archive" -utf8output
          mkdir -p dist
          find Archive -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -name '*.apk' -print -quit)"


      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CFG="$DIR/unreal.json"
          NAME=$(jq -r .name "$CFG")
          VN=$(jq -r .versionName "$CFG")
          SLUG=$(echo "$NAME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//;s/-$//')
          [ -n "$SLUG" ] || SLUG=application
          APK=$(find . -type f -name '*.apk' -not -path '*/.gradle/*' | head -n1)
          test -n "$APK" || { echo "APK introuvable après compilation."; exit 1; }
          cp "$APK" "$SLUG-$VN.apk"
          bash "$GITHUB_WORKSPACE/.github/scripts/release_create.sh" "unreal-$ID" "$SLUG-$VN.apk" --title "$NAME — Build Unreal Android APK" --notes "Compilation Android Build Unreal Android APK. Version : $VN."

      - name: Nettoyer la demande
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -qm "Nettoyage build unreal $ID [skip ci]"
          git pull --rebase -q || true
          git push -q || true

      - name: Enregistrer le journal d'erreur
        if: failure()
        run: |
          mkdir -p "$DIR"
          { echo "== Journal Build Unreal Android APK ($ID) =="; tail -n 400 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true; } > "$DIR/build-error.txt"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f "$DIR/build-error.txt"
          git commit -qm "Journal erreur unreal $ID [skip ci]" || true
          git push -q || true
