name: Build Unity Android APK

on:
  push:
    paths:
      - 'builds/*/unity.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détecter la demande
        shell: bash
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/unity\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Installer le SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extraire le projet
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q "$DIR/app.zip" -d work
      - name: Détecter la racine Unity
        run: |
          PROJECT=$(find work -name ProjectVersion.txt -printf '%h\n' | head -n1)
          test -n "$PROJECT"
          echo "UNITY_PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Compiler Unity pour Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT }}
          targetPlatform: Android
          buildMethod: UnityEditor.BuildPipeline.BuildPlayer
          buildsPath: build
          buildName: application.apk
          versioning: None
      - name: Vérifier l'APK Unity
        run: |
          mkdir -p dist
          find build -type f -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -name '*.apk' -print -quit)"


      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CFG="$DIR/unity.json"
          NAME=$(jq -r .name "$CFG")
          VN=$(jq -r .versionName "$CFG")
          SLUG=$(echo "$NAME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//;s/-$//')
          [ -n "$SLUG" ] || SLUG=application
          APK=$(find . -type f -name '*.apk' -not -path '*/.gradle/*' | head -n1)
          test -n "$APK" || { echo "APK introuvable après compilation."; exit 1; }
          cp "$APK" "$SLUG-$VN.apk"
          bash "$GITHUB_WORKSPACE/.github/scripts/release_create.sh" "unity-$ID" "$SLUG-$VN.apk" --title "$NAME — Build Unity Android APK" --notes "Compilation Android Build Unity Android APK. Version : $VN."

      - name: Nettoyer la demande
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -qm "Nettoyage build unity $ID [skip ci]"
          git pull --rebase -q || true
          git push -q || true

      - name: Enregistrer le journal d'erreur
        if: failure()
        run: |
          mkdir -p "$DIR"
          { echo "== Journal Build Unity Android APK ($ID) =="; tail -n 400 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true; } > "$DIR/build-error.txt"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f "$DIR/build-error.txt"
          git commit -qm "Journal erreur unity $ID [skip ci]" || true
          git push -q || true
