name: Build Cordova APK

on:
  push:
    paths:
      - 'builds/*/cordova.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identifier la demande
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/cordova\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Installer Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compiler Cordova
        run: |
          set -euo pipefail
          CFG="$GITHUB_WORKSPACE/$DIR/cordova.json"
          mkdir -p work/src
          unzip -q "$GITHUB_WORKSPACE/$DIR/app.zip" -d work/src
          ROOT=$(find work/src -name config.xml -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            ROOT=$(find work/src -name package.json -print -quit | xargs -r dirname)
          fi
          test -n "$ROOT" || { echo "config.xml ou package.json introuvable"; exit 1; }
          cd "$ROOT"
          if [ ! -f config.xml ]; then
            NAME=$(jq -r '.name // "CordovaApp"' "$CFG")
            PKG=$(jq -r '.pkg // "com.example.cordovaapp"' "$CFG")
            mkdir -p "$GITHUB_WORKSPACE/work/cordova-app"
            npx --yes cordova create "$GITHUB_WORKSPACE/work/cordova-app" "$PKG" "$NAME"
            if [ -d www ]; then rm -rf "$GITHUB_WORKSPACE/work/cordova-app/www"; cp -R www "$GITHUB_WORKSPACE/work/cordova-app/www"; fi
            ROOT="$GITHUB_WORKSPACE/work/cordova-app"
            cd "$ROOT"
          fi
          npm install
          npm install --save-dev cordova@12
          npx cordova platform add android@13
          npx cordova build android --debug
          APK=$(find platforms/android/app/build/outputs/apk -name '*.apk' | head -n1)
          test -n "$APK" || { echo "APK Cordova introuvable"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/cordova-$ID.apk"
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(jq -r '.name // "Application Cordova"' "$GITHUB_WORKSPACE/$DIR/cordova.json")
          gh release create "apk-$ID" "$GITHUB_WORKSPACE/cordova-$ID.apk" --title "$NAME" --notes "APK Apache Cordova compilé automatiquement."
      - name: Nettoyer la demande
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git rm -r --ignore-unmatch "$DIR"
          git commit -m "Nettoyage build Cordova $ID [skip ci]" || true
          git push || true
